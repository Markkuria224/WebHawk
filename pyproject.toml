[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webhawk"
version = "0.1.0"
description = "A modular desktop web application security assessment platform."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Mark Kuria" }
]
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "pydantic>=2.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "trustme>=1.2.1"
]

[project.scripts]
webhawk = "webhawk.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"